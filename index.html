<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<!-- Content-Security-Policy: allow only our own origin + the two pinned CDN
	     module hosts. The inline <script type="importmap"> is allowed via its
	     exact content hash (no 'unsafe-inline' anywhere). IMPORTANT: if the
	     importmap below changes, recompute the hash and update it here, or the
	     importmap will be silently blocked. frame-ancestors is omitted because
	     meta CSP can't enforce it — add via an HTTP header if framing matters. -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com 'sha256-q223pGLjmOJAJ0MO6UuTyBF5c4nQ8izOkKOqrridzqs='; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
	<!-- viewport-fit=cover only, deliberately NO user-scalable=no / maximum-scale=1.0.
	     Pinch-zoom stays available for accessibility. The canvas rests at
	     touch-action: pan-y (which excludes pinch-zoom by spec) and app.js flips it
	     to `none` during two-finger gestures + preventDefaults multi-touch moves, so
	     the browser never steals the 3D rotation; zoom can only ever kick in where
	     the gesture model permits it. All UI overlays are pointer-events: none, so
	     no clickable element can be misaligned by a scale change. -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<link rel="stylesheet" href="/style.css">
	<link rel="icon" type="img/png" href="black-hole.png">
	<title>Universe</title>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
                "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
            }
        }
    </script>

    <div id="vignette"></div>
    <div id="whiteout"></div>
    <div id="overlay">
        <div id="scroll-prompt">Scroll down to start</div>
    </div>
    <div id="debug-overlay"></div>
    <script type="module" src="/app.js"></script>
</body>
</html>
